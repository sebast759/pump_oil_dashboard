name: Update Oil Dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
  schedule:
    # Every day at 14:30 UTC — updates Brent daily, picks up new EC bulletin on Thursdays
    - cron: '30 14 * * *'
  workflow_dispatch:  # allow manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout script repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Brent provider cache
        uses: actions/cache@v4
        with:
          path: .cache/brent
          key: brent-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            brent-data-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate dashboard
        run: python generate_oil_dashboard.py --output site/index.html
        env:
          GOATCOUNTER_SITE_CODE: ${{ vars.GOATCOUNTER_SITE_CODE }}

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
