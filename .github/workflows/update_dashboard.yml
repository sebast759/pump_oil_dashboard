name: Update Oil Dashboard

on:
  push:
    branches: [main]
  schedule:
    # Every day at 14:30 UTC — updates Brent daily, picks up new EC bulletin on Thursdays
    - cron: '30 14 * * *'
    # Every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
    # Every Thursday at 16:30 UTC: also sends the weekly "fill up before Monday?" email
    - cron: '30 16 * * 4'
  workflow_dispatch:  # allow manual trigger from the Actions tab
    inputs:
      email_mode:
        description: 'Weekly email: none, draft (create in Buttondown, do not send) or send'
        type: choice
        options: [none, draft, send]
        default: none

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout script repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Brent provider cache
        uses: actions/cache@v4
        with:
          path: .cache/brent
          key: brent-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            brent-data-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate dashboard
        run: python generate_oil_dashboard.py --output site/index.html
        env:
          GOATCOUNTER_SITE_CODE: ${{ vars.GOATCOUNTER_SITE_CODE }}

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send weekly email (Thursday schedule or manual)
        if: github.event.schedule == '30 16 * * 4' || (github.event_name == 'workflow_dispatch' && inputs.email_mode != 'none')
        run: python weekly_email.py ${{ inputs.email_mode == 'draft' && '--draft' || '' }}
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
