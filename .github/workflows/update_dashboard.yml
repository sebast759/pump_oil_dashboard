name: Update Oil Dashboard

on:
  schedule:
    # Every Thursday at 14:00 UTC — EC publishes the bulletin Thursday morning
    - cron: '0 14 * * 4'
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout script repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        run: python generate_oil_dashboard.py --no-push --output dashboard/index.html

      - name: Checkout Pages repo
        uses: actions/checkout@v4
        with:
          repository: sebast759/sebast759.github.io
          path: website
          token: ${{ secrets.GH_PAT }}

      - name: Copy dashboard to Pages repo
        run: |
          mkdir -p website/oil_dashboard
          cp dashboard/index.html website/oil_dashboard/index.html

      - name: Commit and push
        run: |
          cd website
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add oil_dashboard/index.html
          git diff --cached --quiet || git commit -m "Update oil dashboard $(date +'%Y-%m-%d %H:%M UTC')"
          git push
